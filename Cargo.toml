[package]
name = "vshell"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
whoami = "1.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

